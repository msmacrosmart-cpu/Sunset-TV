name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'arena/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SunsetTV
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build, lint and unit tests
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Publish build diagnostics
        if: always()
        run: |
          if [ -f build.log ]; then
            python3 - <<'PYCODE'
          import os
          from pathlib import Path
          lines = Path('build.log').read_text().splitlines()
          errors = [l for l in lines if l.startswith('e:') or 'error:' in l or 'Error:' in l or 'FAIL' in l]
          text = '\n'.join(errors if errors else lines[-60:])[-50000:]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('```text\n' + text + '\n```\n')
          for line in errors[:20]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYCODE
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SunsetTV-debug-apk
          path: SunsetTV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SunsetTV-validation-reports
          path: |
            SunsetTV/app/build/reports/
            SunsetTV/app/build/test-results/
